{% extends "base.html" %}

{% block content %}
<!-- ═══════════════════════════ HERO BLOG ═══════════════════════════ -->
<section class="blog-hero py-14">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 hero-content">
    <div class="breadcrumb mb-4 fade-up d1">
      <a href="blog-site.html">Início</a>
      <span class="sep">›</span>
      <span>Blog</span>
    </div>
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
      <div>
        <span class="section-label fade-up d1" style="color:rgba(200,57,43,.8);">Dev Blog</span>
        <h1 class="font-display text-4xl md:text-5xl font-black text-white mt-2 leading-tight fade-up d2">
          Artigos & Tutoriais
        </h1>
        <p class="text-white/60 mt-2 text-sm max-w-lg fade-up d3">
          Conteúdo técnico sobre desenvolvimento web, Python, CSS moderno e as ferramentas que uso no dia a dia.
        </p>
      </div>
      <!-- Live counter -->
      <div class="fade-up d4 flex items-center gap-2" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.6rem 1rem;">
        <span style="width:8px;height:8px;background:#4ade80;border-radius:50%;display:inline-block;box-shadow:0 0 6px #4ade80;"></span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:.72rem;color:rgba(255,255,255,.65);">24 artigos publicados</span>
      </div>
    </div>

    <!-- ── CATEGORY FILTER BAR ── -->
    <div class="cat-bar mt-8 fade-up d4" id="cat-bar">
      <button class="cat-btn active" data-cat="todos" onclick="filterCat(this)">Todos</button>
      <button class="cat-btn" data-cat="tecnologia" onclick="filterCat(this)">🖥️ Tecnologia</button>
      <button class="cat-btn" data-cat="python" onclick="filterCat(this)">🐍 Python</button>
      <button class="cat-btn" data-cat="front-end" onclick="filterCat(this)">🎨 Front-end</button>
      <button class="cat-btn" data-cat="css" onclick="filterCat(this)">✨ CSS & Design</button>
      <button class="cat-btn" data-cat="javascript" onclick="filterCat(this)">⚡ JavaScript</button>
      <button class="cat-btn" data-cat="django" onclick="filterCat(this)">🦄 Django</button>
    </div>
  </div>
</section>
{% endblock %}
